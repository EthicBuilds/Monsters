# Statistik-Zeile je Spieler in der Tab-Liste, setzt Monsters selbst (nur dieser Server sieht sie)
tab-player-lines: false

# Eigenes Zombie-Modell der Design-Session (vorerst nur normale Zombies ohne Elite-Stufe), bei Leistungsproblemen auf false
