name: Monsters
version: '${project.version}'
main: de.ethicbuilds.monsters.Main
api-version: '1.21'
authors: [ codedByGruba ]
softdepend: [ ProtocolLib, LuckPerms, PlaceholderAPI, Nexo ]

commands:
  createMapConfig:
    description: "create Map config"
  locateMonsters:
    description: "locate monsters"
  bosswelle:
    description: "Naechste Welle wird die Boss-Welle (Test)"
  rundenende:
    description: "Beendet die laufende Runde regulaer"
  aufgeben:
    description: "Abstimmung im Team, die Runde zu beenden"
  testwaffe:
    description: "Funktionsmodus auf dem Bauserver: echte Waffe mit voller Munition"
    permission: monsters.bautest.waffe

permissions:
  monsters.bautest.waffe:
    default: op
