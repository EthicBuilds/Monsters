server-name: " "

# Nur auf monsters-bau: keine Runden, Spiel-Modelle funktionieren nur im Funktionsmodus von MonstersBau (/monster)
bau-test: false
# Lebensanzeige ueber den Monstern (Schrift monsters:healthbar im Monsters-Paket)
health-bars: true

# Statistik-Zeile je Spieler in der Tab-Liste, setzt Monsters selbst (nur dieser Server sieht sie)
tab-player-lines: false

# Eigenes Zombie-Modell der Design-Session (vorerst nur normale Zombies ohne Elite-Stufe), bei Leistungsproblemen auf false
zombie-model: true

# Eigene Spieler-Rüstung aus dem Monsters-Paket (Design-Session), erst einschalten, wenn die Texturen im Paket sind
custom-armor: true

# Monsters-Paket (Werkbank, Lebensanzeige, Munition, Scoreboard-Icons), wird beim Betreten zusaetzlich zum Lobby-Paket geschickt
resource-pack:
  url: "http://136.243.146.245:25567/Monsters-pack-38.zip"
  sha1: "1f3a04c442ca8d65094cdbb381485b8e772503e7"

# Nexo-Items des Bauservers: daraus kommt, wie die Moebel gedreht und verschoben angezeigt werden (Nexo speichert das nicht in der Welt)
nexo-items: "../monsters-bau/plugins/Nexo/items"

# Aufzug mit Schacht: so viel tiefer steht das Modell oben als die Etage (Bloecke)
aufzug-oben-tiefer: 0
# Aufzug mit Schacht: so viele Bloecke unter der oberen Etage haelt die Plattform oben, die Stufe kann man hochlaufen
aufzug-oben-bloecke-tiefer: 1
